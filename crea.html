<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crea Invoice Generator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #eee; min-height: 100vh; }
#app-ui { max-width: 820px; margin: 0 auto; padding: 28px 20px; }
.app-header { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid #111; padding-bottom: 12px; margin-bottom: 24px; }
.app-header h1 { font-size: 18px; font-weight: bold; }
.app-header span { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
.upload-zone { border: 2px dashed #bbb; border-radius: 6px; padding: 40px 24px; text-align: center; cursor: pointer; background: #fff; transition: border-color .2s; margin-bottom: 18px; }
.upload-zone:hover, .upload-zone.drag-over { border-color: #2E74B5; background: #f2f7fc; }
.upload-zone .icon { font-size: 32px; margin-bottom: 8px; }
.upload-zone p { color: #666; font-size: 13px; }
#file-input { display: none; }
.list-head { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.item-row { background: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 10px 14px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.item-row .iname { font-weight: bold; }
.item-row .imeta { font-size: 11px; color: #555; font-family: monospace; margin-top: 2px; }
.item-row .itotal { font-family: monospace; font-weight: bold; }
.summary-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: 13px; font-weight: bold; }
.summary-row .amt { font-family: monospace; }
.warn { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; border-radius: 4px; padding: 8px 12px; font-size: 12px; margin: 8px 0; }
.actions { display: flex; gap: 8px; margin: 14px 0; }
.btn { background: #2E74B5; color: #fff; border: none; padding: 10px 22px; font-size: 13px; border-radius: 4px; cursor: pointer; }
.btn:hover { background: #1f5a8f; }
.btn-outline { background: #fff; color: #111; border: 1.5px solid #111; }
.btn-outline:hover { background: #111; color: #fff; }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: #fff; border-radius: 8px; padding: 28px; width: 440px; max-width: 95vw; }
.modal h2 { font-size: 16px; margin-bottom: 6px; }
.modal .sub { font-size: 12px; color: #888; margin-bottom: 18px; }
.modal label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #444; }
.modal input[type=text], .modal input[type=number] { width: 100%; padding: 9px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 14px; font-family: Arial, sans-serif; }
.modal input:focus { outline: none; border-color: #2E74B5; }
.modal .two-col { display: flex; gap: 10px; }
.modal .two-col > div { flex: 1; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
/* ── invoice preview, matching the Crea Excel invoice ── */
#invoice-preview { display: none; margin-top: 18px; }
.inv-page { background: #fff; width: 760px; margin: 0 auto; padding: 30px 40px 24px 40px; font-family: Calibri, Arial, sans-serif; font-size: 11pt; color: #000; border: 1px solid #aaa; }
.inv-bar { height: 6px; background: #2E74B5; }
.inv-title { color: #2E74B5; font-size: 20pt; font-weight: bold; letter-spacing: 0.5px; margin: 16px 0 14px 0; }
.inv-cols { display: flex; gap: 24px; }
.inv-left { width: 230px; flex-shrink: 0; }
.inv-left img { width: 170px; display: block; }
.inv-left .inv-word { font-size: 13pt; letter-spacing: 4px; margin: 2px 0 0 12px; }
.inv-left .inv-invoice { font-size: 13pt; margin: 4px 0 26px 30px; }
.inv-left .phone { color: #2E74B5; font-weight: bold; margin-bottom: 6px; }
.inv-left .email { color: #2E74B5; text-decoration: underline; margin-bottom: 26px; }
.inv-left .addr { font-weight: bold; line-height: 1.8; }
.inv-right { flex: 1; }
.inv-meta div { margin-bottom: 10px; }
.inv-meta .due { font-weight: bold; margin: 14px 0 12px 0; }
.inv-table { border-collapse: collapse; width: 100%; font-size: 11pt; }
.inv-table th { background: #2E74B5; color: #fff; text-align: left; padding: 4px 6px; border: 1px solid #2E74B5; font-weight: bold; }
.inv-table td { border: 1px solid #000; padding: 3px 6px; height: 22px; }
.inv-table td.qty { text-align: right; width: 62px; }
.inv-table td.money { width: 88px; }
.inv-table .acct { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.inv-table .total-lbl { text-align: right; font-weight: normal; }
.inv-bottom-bar { margin-top: 26px; }
@media print {
  body { background: #fff; }
  #app-ui { display: none !important; }
  .modal-overlay { display: none !important; }
  #invoice-preview { display: block !important; margin: 0; }
  .inv-page { border: none; width: 100%; margin: 0; }
  .no-print { display: none !important; }
}
</style>
</head>
<body>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>Shipping</h2>
    <p class="sub" id="modal-sub"></p>
    <label>Shipping price (USD)</label>
    <input type="number" id="ship-input" min="0" step="0.01" placeholder="0.00">
    <label>Studio line</label>
    <input type="text" id="studio-input" placeholder="Z-Edge Piercing / Earthrise FL">
    <div class="modal-actions">
      <button class="btn btn-outline" id="cancel-btn">Cancel</button>
      <button class="btn" id="confirm-btn">Generate PDF</button>
    </div>
  </div>
</div>
<div id="app-ui">
  <div class="app-header">
    <h1>Crea Invoice Generator</h1>
    <span>Order sheet (Excel) to PDF</span>
  </div>
  <div class="upload-zone" id="upload-zone">
    <div class="icon">&#128203;</div>
    <p><strong>Drop the order sheet here (.xlsx)</strong></p>
    <p style="margin-top:4px;">or click to browse</p>
    <input type="file" id="file-input" accept=".xlsx,.xls,.csv">
  </div>
  <div id="order-view" style="display:none;">
    <div class="list-head">
      <span id="list-title">Ordered items</span>
      <button class="btn btn-outline" id="new-file-btn" style="padding:6px 14px;font-size:12px;">&#8635; New order sheet</button>
    </div>
    <div id="item-rows"></div>
    <div class="summary-row"><span>Item Subtotal</span><span class="amt" id="sum-amt"></span></div>
    <div id="check-warn" class="warn" style="display:none;"></div>
    <div class="actions">
      <button class="btn" id="invoice-btn">Generate Invoice&hellip;</button>
      <button class="btn no-print" id="pdf-btn" style="display:none;">&#128438; Save PDF Again</button>
    </div>
  </div>
</div>
<div id="invoice-preview">
  <div class="inv-page" id="invoice-content"></div>
</div>

function toNum(v) { var x = parseFloat(v); return isNaN(x) ? 0 : x; }
function thousands(v) {
  var s = v.toFixed(2);

// Match the wording used on past Crea invoices
function shortName(desc) {
  return desc
    .replace(/\bRegular\b/g, 'Reg')
    .replace(/Press-?fit/gi, 'Pressfit')
    .replace(/\bTaper$/,'Tapers')
    .replace(/\bNeedle$/,'Needles');
}
// "Earthrise_Order_09142026A.xlsx" -> {loc:'Earthrise', date:'09/14/26', rev:'A'}
function parseFileName(name) {
  var base = (name || '').replace(/\.[^.]+$/, '');
  var m = base.match(/^(.*?)[_\s-]*Order[_\s-]*(\d{8})?([A-Za-z]?)$/i);
  var out = { loc: '', date: '', rev: '' };
  if (m) {
    out.loc = (m[1] || '').replace(/[_-]+/g, ' ').trim();
    if (m[2]) out.date = m[2].slice(0, 2) + '/' + m[2].slice(2, 4) + '/' + m[2].slice(6, 8);
    out.rev = m[3] || '';
  } else {
    out.loc = base.replace(/[_-]+/g, ' ').trim();
  }
  return out;
}
// ── PARSE ORDER SHEET ──
function parseSheet(data, fileName) {
  var wb = XLSX.read(data, { type: 'array' });
  var ws = wb.Sheets[wb.SheetNames[0]];
  var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  var head = -1, col = {};
  for (var r = 0; r < Math.min(rows.length, 20); r++) {
    var lower = (rows[r] || []).map(function(c) { return String(c == null ? '' : c).toLowerCase().trim(); });
    if (lower.indexOf('quantity') !== -1 && (lower.indexOf('sku') !== -1 || lower.indexOf('description') !== -1)) {
      head = r;
      for (var c = 0; c < lower.length; c++) {
        if (lower[c] === 'sku') col.sku = c;
        if (lower[c] === 'description') col.desc = c;
        if (lower[c].indexOf('distributor') !== -1) col.price = c;
        if (lower[c] === 'quantity') col.qty = c;
        if (lower[c] === 'total') col.total = c;
      }
      break;
    }
  }
  if (head === -1) throw new Error('Could not find the header row (needs SKU/Description and Quantity columns).');
  var items = [], subtotal = 0, sheetTotal = null;
  for (var r = head + 1; r < rows.length; r++) {
    var row = rows[r] || [];
    var skuCell = String(row[col.sku] == null ? '' : row[col.sku]).trim();
    if (/^total$/i.test(skuCell)) { sheetTotal = toNum(row[col.total]); continue; }
    var qty = toNum(row[col.qty]);
    if (qty <= 0) continue;
    var desc = String(row[col.desc] == null ? skuCell : row[col.desc]).replace(/\s+/g, ' ').trim();
    var price = toNum(row[col.price]);
    items.push({ name: shortName(desc), qty: qty, price: price });
    subtotal += qty * price;
  }
  var fn = parseFileName(fileName);
  return { items: items, subtotal: subtotal, sheetTotal: sheetTotal, loc: fn.loc, orderDate: fn.date, rev: fn.rev, fileName: fileName };
}

function showOrder() {
  var rowsEl = document.getElementById('item-rows');
  rowsEl.innerHTML = '';
  for (var i = 0; i < order.items.length; i++) {
    var it = order.items[i];
    var div = document.createElement('div');
    div.className = 'item-row';
    var left = document.createElement('div');
    var nm = document.createElement('div'); nm.className = 'iname'; nm.textContent = it.name;
    var mt = document.createElement('div'); mt.className = 'imeta';
    mt.textContent = it.qty + ' x ' + money(it.price);
    left.appendChild(nm); left.appendChild(mt);
    var right = document.createElement('div'); right.className = 'itotal';
    right.textContent = money(it.qty * it.price);
    div.appendChild(left); div.appendChild(right);
    rowsEl.appendChild(div);
  }
  document.getElementById('list-title').textContent = 'Ordered items — ' + (order.loc || order.fileName) + (order.orderDate ? ' (' + order.orderDate + (order.rev || '') + ')' : '');
  document.getElementById('sum-amt').textContent = money(order.subtotal);
  var warn = document.getElementById('check-warn');
  if (order.sheetTotal != null && Math.abs(order.sheetTotal - order.subtotal) > 0.01) {
    warn.textContent = 'Heads up: the sheet\'s own TOTAL cell says ' + money(order.sheetTotal) + ' but the items add up to ' + money(order.subtotal) + '. Double-check the sheet.';
    warn.style.display = 'block';
  } else {
    warn.style.display = 'none';
  }
  document.getElementById('order-view').style.display = 'block';
  document.getElementById('upload-zone').style.display = 'none';
  document.getElementById('invoice-preview').style.display = 'none';
  document.getElementById('pdf-btn').style.display = 'none';
}

    + '<div>' + esc(invoice.studio) + '</div>'
    + '<div>Date: ' + dateStr() + '</div>'
    + '<div>Pay to the order of:</div>'
    + '<div>' + esc(PAY_TO) + '</div>'
    + '<div>Routing #: ' + ROUTING + '</div>'
    + '<div>Account #: ' + ACCOUNT + '</div>'
    + '<div class="due">Payment Due: ' + dueStr() + '</div>'
    + '</div>'
    + '<table class="inv-table"><thead><tr><th>Description</th><th style="width:62px;">Quantity</th><th style="width:88px;">Unit Price</th><th style="width:88px;">Cost</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table>'
    + '</div></div>'
    + '<div class="inv-bar inv-bottom-bar"></div>';
}
// ── PDF ──
function buildPdf() {
  if (!window.jspdf || !window.jspdf.jsPDF) return null;
  var doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter', compress: true });
  var M = 34, R = 578;
  var blue = [46, 116, 181];
  // top bar + title
  doc.setFillColor(blue[0], blue[1], blue[2]);
  doc.rect(M, 56, R - M, 5, 'F');
  doc.setTextColor(blue[0], blue[1], blue[2]);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(17);
  doc.text('STILETTO PIERCING SUPPLIES', M, 88);
  // left column
  try { doc.addImage('data:image/png;base64,' + LOGO, 'PNG', M, 104, 150, 101); } catch (e) {}
  doc.setTextColor(0, 0, 0);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');
  doc.text('P I E R C I N G   S U P P L I E S', M + 8, 216);
  doc.setFontSize(12);
  doc.text('INVOICE', M + 45, 233);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(blue[0], blue[1], blue[2]);
  doc.text('1-614-674-6652', M, 262);
  doc.setFont('helvetica', 'normal');
  doc.text('info@stilettosupply.com', M, 280);
  doc.setLineWidth(0.6); doc.setDrawColor(blue[0], blue[1], blue[2]);
  doc.line(M, 282.5, M + doc.getTextWidth('info@stilettosupply.com'), 282.5);
  doc.setTextColor(0, 0, 0);
  doc.setFont('helvetica', 'bold');
  doc.text('989 Old Henderson Rd', M, 316);
  doc.text('Suite C', M, 333);
  doc.text('Columbus OH 43220', M, 350);
  // right column meta
  var X = 250;
  doc.setFont('helvetica', 'normal');
  var meta = ['Attention: ' + ATTENTION, invoice.studio, 'Date: ' + dateStr(),
              'Pay to the order of:', PAY_TO, 'Routing #: ' + ROUTING, 'Account #: ' + ACCOUNT];
  var y = 118;
  for (var i = 0; i < meta.length; i++) { doc.text(meta[i], X, y); y += 22; }
  doc.setFont('helvetica', 'bold');
  doc.text('Payment Due: ' + dueStr(), X, y + 4);
  y += 26;
  // table
  var c0 = X, c1 = 420, c2 = 466, c3 = 514, c4 = R, rh = 19;
  doc.setFillColor(blue[0], blue[1], blue[2]);
  doc.rect(c0, y, c4 - c0, rh, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(10);
  doc.text('Description', c0 + 4, y + 13);
  doc.text('Quantity', c1 + 2, y + 13);
  doc.text('Unit Price', c2 + 2, y + 13);
  doc.text('Cost', c3 + 4, y + 13);
  doc.setTextColor(0, 0, 0);
  doc.setFont('helvetica', 'normal');
  doc.setDrawColor(0, 0, 0); doc.setLineWidth(0.7);
  y += rh;
  function cellRow(desc, qty, unit, cost, opts) {
    opts = opts || {};
    doc.rect(c0, y, c1 - c0, rh); doc.rect(c1, y, c2 - c1, rh);
    doc.rect(c2, y, c3 - c2, rh); doc.rect(c3, y, c4 - c3, rh);
    var ty = y + 13;
    if (desc) {
      var name = desc;
      while (name.length > 3 && doc.getTextWidth(name) > c1 - c0 - 8) name = name.slice(0, -1);
      doc.text(name, c0 + 4, ty);
    }
    if (qty != null) doc.text(String(qty), c2 - 4, ty, { align: 'right' });
    if (opts.totalLabel) doc.text('Total', c3 - 4, ty, { align: 'right' });
    else if (unit !== undefined) { doc.text('$', c2 + 4, ty); doc.text(unit == null ? '-' : thousands(unit), c3 - 4, ty, { align: 'right' }); }
    if (cost !== undefined) { doc.text('$', c3 + 4, ty); doc.text(cost == null ? '-' : thousands(cost), c4 - 4, ty, { align: 'right' }); }
    y += rh;
  }
  var BODY_ROWS = 15;
  for (var r = 0; r < BODY_ROWS; r++) {
    var it = order.items[r];
    if (it) cellRow(it.name, it.qty, it.price, it.qty * it.price);
    else cellRow('', null, undefined, null);
  }
  cellRow('', null, undefined, order.subtotal);
  cellRow('Shipping', null, undefined, invoice.shipping);
  cellRow('', null, undefined, null);
  cellRow('', null, undefined, order.subtotal + invoice.shipping, { totalLabel: true });
  // bottom bar
  doc.setFillColor(blue[0], blue[1], blue[2]);
  doc.rect(M, Math.max(y + 24, 726), R - M, 5, 'F');
  doc.setProperties({ title: 'M. Crea ' + fileStamp() });
  return doc;
}
function savePdf() {
  var doc = buildPdf();
  if (!doc) { alert('PDF library did not load — check your internet connection and refresh.'); return Promise.resolve('nopdf'); }
  var fname = 'M. Crea ' + fileStamp() + '.pdf';
  return downloadsChannel.then(function(dl) {
    if (dl) {
      return dl.save({ filename: fname, data: doc.output('arraybuffer') })
        .then(function() { return 'saved'; })
        .catch(function(err) { return (err && err.code) || 'error'; });
    }
    if (window.electronAPI && window.electronAPI.savePDF) return 'electron';
    doc.save(fname);
    return 'saved';
  });
}
// ── FILE LOADING ──
function handleFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      order = parseSheet(new Uint8Array(e.target.result), file.name);
      invoice = null;
      if (!order.items.length) {
        alert('No ordered items found — the Quantity column is empty in this sheet.');
        return;
      }
      showOrder();
      openModal(); // ask for shipping right away, then generate
    } catch (err) {
      alert('Error reading the order sheet: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}
document.getElementById('upload-zone').addEventListener('click', function() {
  document.getElementById('file-input').click();
});
document.getElementById('upload-zone').addEventListener('dragover', function(e) {
  e.preventDefault(); this.classList.add('drag-over');
});
document.getElementById('upload-zone').addEventListener('dragleave', function() {
  this.classList.remove('drag-over');
});
document.getElementById('upload-zone').addEventListener('drop', function(e) {
  e.preventDefault(); this.classList.remove('drag-over');
  handleFile(e.dataTransfer.files[0]);
});
document.getElementById('file-input').addEventListener('change', function(e) {
  handleFile(e.target.files[0]);
});
document.getElementById('invoice-btn').addEventListener('click', openModal);
document.getElementById('pdf-btn').addEventListener('click', function() {
  if (window.electronAPI && window.electronAPI.savePDF) {
    window.electronAPI.savePDF(document.title || 'invoice');
  } else if (invoice) {
    savePdf();
  }
});
document.getElementById('new-file-btn').addEventListener('click', function() {
  document.getElementById('order-view').style.display = 'none';
  document.getElementById('invoice-preview').style.display = 'none';
  document.getElementById('upload-zone').style.display = 'block';
  document.getElementById('file-input').value = '';
  order = null; invoice = null;
});
</script>
