<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stiletto Invoice Generator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #eee; min-height: 100vh; }
#app-ui { max-width: 820px; margin: 0 auto; padding: 28px 20px; }
.app-header { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid #111; padding-bottom: 12px; margin-bottom: 24px; }
.app-header h1 { font-size: 18px; font-weight: bold; }
.app-header span { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
.upload-zone { border: 2px dashed #bbb; border-radius: 6px; padding: 40px 24px; text-align: center; cursor: pointer; background: #fff; transition: border-color .2s; margin-bottom: 18px; }
.upload-zone:hover, .upload-zone.drag-over { border-color: #c00; background: #fff5f4; }
.upload-zone .icon { font-size: 32px; margin-bottom: 8px; }
.upload-zone p { color: #666; font-size: 13px; }
#file-input { display: none; }
.list-head { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 8px; }
.order-card { background: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 11px 14px; margin-bottom: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.order-card:hover { border-color: #333; }
.order-card.selected { border-color: #c00; background: #fff5f4; }
.order-card .onum { font-weight: bold; font-size: 13px; font-family: monospace; }
.order-card .ometa { font-size: 11px; color: #555; font-family: monospace; margin-top: 2px; }
.order-card .ototal { font-family: monospace; font-size: 13px; font-weight: bold; }
.store-tag { display: inline-block; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; border-radius: 3px; padding: 2px 7px; font-size: 11px; font-weight: bold; margin-left: 6px; }
.store-tag.unmatched { background: #fff3e0; color: #e65100; border-color: #ffcc80; }
.actions { display: flex; gap: 8px; margin: 14px 0; }
.btn { background: #111; color: #fff; border: none; padding: 10px 22px; font-size: 13px; border-radius: 4px; cursor: pointer; }
.btn:hover { background: #c00; }
.btn-outline { background: #fff; color: #111; border: 1.5px solid #111; }
.btn-outline:hover { background: #111; color: #fff; }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: #fff; border-radius: 8px; padding: 28px; width: 460px; max-width: 95vw; }
.modal h2 { font-size: 16px; margin-bottom: 6px; }
.modal .sub { font-size: 12px; color: #888; margin-bottom: 18px; }
.modal label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #444; }
.modal select, .modal input[type=text] { width: 100%; padding: 9px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 14px; }
.modal select:focus, .modal input:focus { outline: none; border-color: #c00; }
.custom-row { display: none; }
.custom-row.visible { display: block; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
#invoice-preview { display: none; margin-top: 18px; }
.inv-page { background: #fff; width: 760px; margin: 0 auto; padding: 28px 36px 36px 36px; font-family: Arial, sans-serif; font-size: 10pt; color: #000; border: 1px solid #aaa; }
.inv-top { margin-bottom: 18px; }
.inv-addr-row { display: flex; margin-bottom: 14px; }
.inv-addr-col { flex: 1; line-height: 1.7; font-size: 10pt; }
.inv-addr-col .lbl { font-weight: bold; }
.inv-body { display: flex; gap: 20px; align-items: flex-start; margin-top: 8px; }
.inv-meta { width: 195px; flex-shrink: 0; font-size: 10pt; line-height: 2; }
.inv-meta .inv-id { font-size: 10.5pt; margin-bottom: 2px; }
.inv-table { flex: 1; border-collapse: collapse; font-size: 10pt; width: 100%; }
.inv-table thead th { border-bottom: 1px solid #000; padding: 3px 4px; text-align: left; font-weight: bold; }
.inv-table thead th.r { text-align: right; }
.inv-table tbody td { border: 1px solid #999; padding: 2px 4px; height: 20px; }
.inv-table tbody td.r { text-align: right; font-family: monospace; }
.inv-totals-wrap { display: flex; justify-content: flex-end; }
.inv-totals table { border-collapse: collapse; font-size: 10pt; }
.inv-totals td { padding: 2px 4px; }
.inv-totals td.lbl { text-align: right; min-width: 130px; }
.inv-totals td.amt { text-align: right; font-family: monospace; width: 85px; border-left: 1px solid #999; border-right: 1px solid #999; }
.inv-totals .subtotal-row td.amt { border-top: 1px solid #999; }
.inv-totals .shipping-row td.amt { border-bottom: 1px solid #999; }
.inv-totals .total-row td { font-weight: bold; padding-top: 4px; }
.inv-footer { margin-top: 14px; font-size: 10pt; line-height: 1.9; font-weight: bold; }
@media print {
  body { background: #fff; }
  #app-ui { display: none !important; }
  .modal-overlay { display: none !important; }
  #invoice-preview { display: block !important; margin: 0; }
  .inv-page { border: none; width: 100%; padding: 18px 24px; margin: 0; }
  .no-print { display: none !important; }
}
</style>
</head>
<body>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>Assign Store</h2>
    <p class="sub" id="modal-sub"></p>
    <label>Select store</label>
    <select id="store-select"></select>
    <div class="custom-row" id="custom-row">
      <label>Store name</label>
      <input type="text" id="custom-name" placeholder="e.g. Chestnut Hill">
      <label>State / Province</label>
      <input type="text" id="custom-state" placeholder="e.g. MA">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="cancel-btn">Cancel</button>
      <button class="btn" id="confirm-btn">Confirm &amp; Generate PDF</button>
    </div>
  </div>
</div>
<div id="app-ui">
  <div class="app-header">
    <h1>Stiletto Invoice Generator</h1>
    <span>Shopify CSV to PDF</span>
  </div>
  <div class="upload-zone" id="upload-zone">
    <div class="icon">&#128196;</div>
    <p><strong>Drop your Shopify orders CSV here</strong></p>
    <p style="margin-top:4px;">or click to browse</p>
    <input type="file" id="file-input" accept=".csv">
  </div>
  <div id="order-list" style="display:none;">
    <div class="list-head" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Matched orders download automatically — click an order to reassign its store or save its PDF again</span>
      <button class="btn btn-outline" id="new-csv-btn" style="display:none;padding:6px 14px;font-size:12px;">&#8635; New CSV</button>
    </div>
    <div id="order-cards"></div>
  </div>
  <div id="actions" class="actions" style="display:none;">
    <button class="btn btn-outline no-print" id="back-btn">&#8592; Back</button>
    <button class="btn no-print" id="pdf-btn">&#128438; Save as PDF</button>
  </div>
</div>
<div id="invoice-preview">
  <div class="inv-page" id="invoice-content"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

// ── CSV PARSER ──
function parseCSV(text) {
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  var delim = text.indexOf('\t') !== -1 && text.split('\n')[0].indexOf('\t') !== -1 ? '\t' : ',';
  var records = [];
  var cur = '', inQ = false, fields = [];
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (c === '"') {
      if (inQ && text[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === delim && !inQ) {
      fields.push(cur); cur = '';
    } else if (c === '\n' && !inQ) {
      fields.push(cur); cur = '';
      records.push(fields); fields = [];
    } else {
      cur += c;
    }
  }
  if (fields.length > 0 || cur) { fields.push(cur); records.push(fields); }
  if (records.length < 2) return [];
  var headers = records[0].map(function(h) { return h.trim(); });
  var rows = [];
  for (var r = 1; r < records.length; r++) {
    var rec = records[r];
    if (!rec.some(function(v) { return v.trim(); })) continue;
    var row = {};
    for (var j = 0; j < headers.length; j++) {
      var v = (rec[j] || '').trim();
      row[headers[j]] = (v === 'nan' || v === 'NaN') ? '' : v;
    }
    rows.push(row);
  }
  return rows;
}
// ── GROUP BY ORDER ──
function groupOrders(rows) {
  orders = {}; orderKeys = [];
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    var n = (row['Name'] || '').trim();
    if (!n || !/^#?\d/.test(n)) continue;
    if (!orders[n]) { orders[n] = { h: null, items: [], store: null }; orderKeys.push(n); }
    if (!orders[n].h || (!orders[n].h['Billing Name'] && row['Billing Name'])) orders[n].h = row;
    if (row['Lineitem name'] && row['Lineitem name'].trim()) orders[n].items.push(row);
  }
  for (var k = 0; k < orderKeys.length; k++) {
    var key = orderKeys[k];
    if (!orders[key].h) orders[key].h = orders[key].items[0] || {};
  }
}
// ── STORE MATCHING ──
function matchStore(h) {
  var email = (h['Email'] || '').toLowerCase().trim();
  var company = (h['Shipping Company'] || h['Billing Company'] || '').toLowerCase().trim();
  for (var i = 0; i < STORES.length; i++) {
    var s = STORES[i];
    if (s.email && s.email.toLowerCase() === email) return s;
  }
  for (var i = 0; i < STORES.length; i++) {
    var s = STORES[i];
    var sn = s.name.toLowerCase().replace(/[^a-z]/g,'');
    var co = company.replace(/[^a-z]/g,'');
    if (co && sn && (co.indexOf(sn) !== -1 || sn.indexOf(co) !== -1)) return s;
  }
  return null;
}

        var previewId = makeInvoiceId(matched ? matched.name : '', '');
        var card = document.createElement('div');
        card.className = 'order-card';
        card.setAttribute('data-order', num);
        card.innerHTML = '<div>'
          + '<div class="onum">' + num + ' <span class="' + tagClass + '">' + tagText + '</span></div>'
          + '<div class="ometa">' + previewId + '</div>'
          + '</div>'
          + '<div class="ototal">$' + total.toFixed(2) + '</div>';
        (function(n) {
          card.addEventListener('click', function() {
            document.querySelectorAll('.order-card').forEach(function(c) { c.classList.remove('selected'); });
            card.classList.add('selected');
            openModal(n);
          });
        })(num);
        container.appendChild(card);
      }
      document.getElementById('order-list').style.display = 'block';
      document.getElementById('upload-zone').style.display = 'none';
      document.getElementById('invoice-preview').style.display = 'none';
      document.getElementById('actions').style.display = 'none';
      document.getElementById('new-csv-btn').style.display = 'inline-block';
      autoDeliverAll();
    } catch(err) {
      alert('Error loading CSV: ' + err.message + '\n' + err.stack);
    }
  };
  reader.readAsText(file);
}
document.getElementById('upload-zone').addEventListener('click', function() {
  document.getElementById('file-input').click();
});
document.getElementById('upload-zone').addEventListener('dragover', function(e) {
  e.preventDefault(); this.classList.add('drag-over');
});
document.getElementById('upload-zone').addEventListener('dragleave', function() {
  this.classList.remove('drag-over');
});
document.getElementById('upload-zone').addEventListener('drop', function(e) {
  e.preventDefault(); this.classList.remove('drag-over');
  handleFile(e.dataTransfer.files[0]);
});
document.getElementById('file-input').addEventListener('change', function(e) {
  handleFile(e.target.files[0]);
});
document.getElementById('back-btn').addEventListener('click', function() {
  document.getElementById('invoice-preview').style.display = 'none';
  document.getElementById('actions').style.display = 'none';
  document.querySelectorAll('.order-card').forEach(function(c) { c.classList.remove('selected'); });
});
document.getElementById('pdf-btn').addEventListener('click', function() {
  if (window.electronAPI && window.electronAPI.savePDF) {
    window.electronAPI.savePDF(document.title || 'invoice');
  } else if (lastRenderedNum) {
    savePdf(lastRenderedNum);
  } else {
    window.print();
  }
});
document.getElementById('new-csv-btn').addEventListener('click', function() {
  document.getElementById('order-list').style.display = 'none';
  document.getElementById('invoice-preview').style.display = 'none';
  document.getElementById('actions').style.display = 'none';
  document.getElementById('upload-zone').style.display = 'block';
  document.getElementById('file-input').value = '';
  lastRenderedNum = null;
});
</script>
</body>
</html>
